<div class="flex flex-col gap-4">
    <bft-input-text name="Name" label="Raw Material Name" [(ngModel)]="formData.Name" [required]="true" [skeleton]="isDataLoading" />
    <bft-select name="UnitID" label="Unit" [displayList]="units" valueField="ID" displayField="Name"
        [(ngModel)]="formData.UnitID" [required]="true" [skeleton]="isDataLoading" />
    <bft-checkbox name="IsActive" label="Active" [(ngModel)]="formData.IsActive" [skeleton]="isDataLoading" />
</div>
